<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Coach's Corner — PennyWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --marble: #F3EFE6; --marble-dark: #E4DCC9;
    --wood-dark: #8B6239; --wood-darker: #6B4A29;
    --brass: #C9A227; --sage: #7C9473; --ink: #2B2620; --error: #C0453A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--marble); color: var(--ink); font-family: 'Work Sans', sans-serif; }
  h1, h2 { font-family: 'Fraunces', serif; margin: 0; font-weight: 500; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 2rem; border-bottom: 1px solid var(--marble-dark);
  }
  header .back { text-decoration: none; color: var(--wood-darker); font-size: 0.9rem; }
  header .logout { cursor: pointer; color: #8A7F6C; font-size: 0.85rem; text-decoration: underline; }

  .wrap { max-width: 700px; margin: 0 auto; padding: 2.5rem 1.5rem 2rem; }
  .wrap h1 { font-size: 1.8rem; color: var(--wood-darker); }
  .wrap > p.lead { color: #7A7266; margin-top: 0.4rem; margin-bottom: 1.2rem; }

  .data-banner {
    background: white; border-left: 4px solid var(--brass); border-radius: 8px;
    padding: 0.8rem 1rem; font-size: 0.85rem; color: #5b5347; margin-bottom: 1.2rem;
  }
  .data-banner a { color: var(--wood-darker); font-weight: 500; }
  .data-banner.ok { border-left-color: var(--sage); }

  .chat-log { display: flex; flex-direction: column; gap: 1rem; min-height: 160px; }

  .bubble {
    max-width: 82%; padding: 0.9rem 1.1rem; border-radius: 14px;
    font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end; background: var(--wood-darker); color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start; background: white; border: 1px solid var(--marble-dark);
    border-bottom-left-radius: 4px;
  }
  .bubble.loading { color: #8A7F6C; font-style: italic; }
  .bubble.error { border-color: var(--error); color: var(--error); }

  .input-row { display: flex; gap: 0.6rem; margin-top: 1.5rem; position: sticky; bottom: 1rem; }
  .input-row input {
    flex: 1; padding: 0.85rem 1rem; border-radius: 10px;
    border: 1.5px solid var(--marble-dark); font-family: inherit; font-size: 0.92rem;
  }
  .input-row button {
    padding: 0.85rem 1.4rem; background: var(--wood-darker); color: white;
    border: none; border-radius: 10px; font-family: 'Fraunces', serif; cursor: pointer;
  }
  .input-row button:hover { background: var(--brass); }
  .input-row button:disabled { opacity: 0.5; cursor: default; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .suggestions button {
    background: white; border: 1px solid var(--marble-dark); border-radius: 999px;
    padding: 0.45rem 0.9rem; font-size: 0.8rem; cursor: pointer; color: var(--wood-darker);
  }
  .suggestions button:hover { border-color: var(--brass); }

  .privacy-note { font-size: 0.75rem; color: #8A7F6C; margin-top: 1rem; text-align: center; }
</style>
</head>
<body>

  <header>
    <a class="back" href="index.html">← Back to the lobby</a>
    <span class="logout" id="logoutBtn">Log out</span>
  </header>

  <div class="wrap">
    <h1>🧭 The Coach's Corner</h1>
    <p class="lead">Advice that starts from your own numbers.</p>

    <div class="data-banner" id="dataBanner">Checking your spending data…</div>

    <div class="suggestions" id="suggestions">
      <button data-q="How much can I safely invest every month?">How much can I safely invest monthly?</button>
      <button data-q="Where am I overspending?">Where am I overspending?</button>
      <button data-q="Am I ready to build an emergency fund?">Am I ready for an emergency fund?</button>
      <button data-q="Suggest a simple investment plan for me.">Suggest a simple investment plan</button>
    </div>

    <div class="chat-log" id="chatLog"></div>

    <div class="input-row">
      <input type="text" id="questionInput" placeholder="Ask about your money…" />
      <button id="askBtn">Ask</button>
    </div>

    <div class="privacy-note">Only totals and category summaries are sent to the AI, never your individual transactions. Not financial advice.</div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/coach.js"></script>
</body>
</html>
